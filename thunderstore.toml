[config]
schemaVersion = "0.0.1"

[package]
# namespace MUST equal the Thunderstore team that owns the service-account token.
namespace = "GamerSaloon"
name = "GamerSaloon"
# Bump this in every PR that should ship — Thunderstore refuses to re-upload an existing version.
versionNumber = "1.0.0"
description = "Client mod set for the Gamer Saloon Valheim server: XPortal, Advanced Portals, Seasonality, Quick Stack Store, Equipment and Quick Slots, voice chat and QoL. Versions pinned to match the server."
websiteUrl = "https://github.com/sjdodge123/GamerSaloon-Valheim-Modpack"
containsNsfwContent = false

# Exact versions — they MUST match what the server runs (XPortal refuses any version mismatch).
[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"
ValheimModding-JsonDotNET = "13.0.4"
ValheimModding-YamlDotNet = "16.3.1"
shudnal-ConditionalConfigSync = "1.0.10"
MSchmoecker-MultiUserChest = "0.6.2"
Goldenrevolver-Quick_Stack_Store_Sort_Trash_Restock = "1.4.15"
RandyKnapp-EquipmentAndQuickSlots = "3.1.3"
RustyMods-Seasonality = "3.8.3"
MidnightMods-NetworkPerformanceSystem = "1.16.0"
SpikeHimself-XPortal = "1.2.26"
RandyKnapp-AdvancedPortals = "1.2.0"
Ivvty-PortalPreview = "1.4.0"
Neobotics-QuietPortals = "1.0.0"
Toxo-CraftFromChests = "0.4.0"
MainStreetGaming-MassFarming = "1.13.0"
Biozip-HoverCompare = "0.5.1"
ComfyMods-ComfyAutoRepair = "1.1.0"
cjayride-InstantMonsterLootDrop = "0.8.2"
BORTY-ValheimVoiceChat = "2.1.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

# Everything under ./config lands in each player's BepInEx/config on install/update.
[[build.copy]]
source = "./config"
target = "config"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["modpacks"]

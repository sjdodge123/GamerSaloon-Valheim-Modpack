## Shipped by the GamerSaloon modpack: only the settings we change. BepInEx fills in the rest with defaults on launch.

[Audio]

## Multiplier applied to captured mic samples before encoding and level metering.
# Setting type: Single
# Default value: 1
MicGain = 2

[Server]

## Distance (meters) within which voice is at full volume. Server-synced: the host's value applies to all connected clients. [Synced with Server]
# Setting type: Single
# Default value: 2
ProximityMinDistance = 10

## Distance (meters) beyond which voice is inaudible. Server-synced: the host's value applies to all connected clients. [Synced with Server]
# Setting type: Single
# Default value: 25
ProximityMaxDistance = 50

name: Publish modpack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two publishes at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Skip if this version is already on Thunderstore
        id: check
        run: |
          version=$(python scripts/check_pack.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if python scripts/check_pack.py published; then
            echo "Version $version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Every dependency exists at its pinned version
        if: steps.check.outputs.publish == 'true'
        run: python scripts/check_pack.py deps

      - name: Install Thunderstore CLI
        if: steps.check.outputs.publish == 'true'
        run: dotnet tool install --global tcli --version 0.2.4

      - name: Build and publish to Thunderstore
        if: steps.check.outputs.publish == 'true'
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: tcli publish

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
